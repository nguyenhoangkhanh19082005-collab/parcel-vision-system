[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "machine-vision-sorter"
version = "0.2.0"
description = "Machine-vision station for parcel QR/logo reading and damage classification."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "opencv-python>=4.10",
  "PyQt6>=6.7",
  "PyYAML>=6.0",
  "zxing-cpp>=2.2",
]

[project.optional-dependencies]
database = ["supabase>=2.10", "python-dotenv>=1.0"]
dev = ["pytest>=8.0", "ruff>=0.8"]
build = ["pyinstaller>=6.0"]

[project.scripts]
machine-vision = "machine_vision.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
